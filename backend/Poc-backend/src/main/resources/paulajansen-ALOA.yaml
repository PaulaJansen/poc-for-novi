        widthInCm:
          type: integer
          example: 60
        lengthInCm:
          type: integer
          example: 80
        heightInCm:
          type: integer
          example: 2
      description: Response DTO van een kunstwerk.
    auth_body:
      required:
      - password
      - username
      type: object
      properties:
        username:
          type: string
          example: janedoe
        password:
          type: string
