openapi: 3.0.0
info:
  title: A Lot Of Art API Documentation
  description: |
    De A Lot Of Artwork (ALOA) web-API is een gemakkelijke etalage voor kunstenaars om hun werken de wereld in te sturen en een winkel voor bezoekers die geïnteresseerd zijn in toegankelijke kunst. Zij kunnen hier zoeken naar werk dat het aanspreekt en dit uiteindelijk ook kopen en/of huren.

    ## Beveiliging

    Sommige endpoints zijn beveiligd. Een gebruiker moet ingelogd zijn en/of een bepaalde rol hebben om gebruik te maken van deze endpoints. De huidige rollen zijn:

    - VISITOR: bedoeld voor gebruikers die als bezoeker het platform willen gebruiken om te zoeken naar kunst.
    - ARTIST: bedoeld voor gebruikers die als kunstenaar hun kunstwerken op het platform willen plaatsen.

    Een gebruiker die een beveiligde endpoint succesvol wil gebruiken moet geautheticeerd worden door in de header van een request een JSON Web Token (JWT) als Bearer token mee te sturen.
  version: 1.0.0
servers:
- url: https://virtserver.swaggerhub.com/freelance-9e2/A-Lot-Of-Art/1.0.0
  description: SwaggerHub API Auto Mocking
- url: https://localhost:8080
  description: SwaggerHub API Auto Mocking
paths:
  /auth:
    post:
      tags:
      - Authentication
      summary: Inloggen
      description: Logt een gebruiker in en geeft een JWT token terug. Bij dit request moet een username en password meegestuurd worden.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth_body"
        required: true
      responses:
        "200":
          description: Een json object met daarin een jwt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200"
        "401":
          description: Ongeldige gebruikersnaam of wachtwoord.
  /roles:
    get:
      tags:
      - Roles
      summary: Haal rollen op
      description: Haalt alle beschikbare rollen op.
      responses:
        "200":
          description: Een lijst van alle bestaande rollen.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleResponseDto"
        "500":
          description: Interne serverfout.
  /roles/{roleName}:
    get:
      tags:
      - Roles
      summary: Haal een rol op
      description: Haalt een rol op naam op.
      parameters:
      - name: roleName
        in: path
        description: Naam van de rol
        required: true
        schema:
          type: string
          enum:
          - VISITOR
          - ARTIST
      responses:
        "200":
          description: Een specifieke rol.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponseDto"
        "404":
          description: Rol niet gevonden.
  /genres:
    get:
      tags:
      - Genres
      summary: Haal alle genres op
      description: Vraagt een lijst van alle beschikbare genres op.
      responses:
        "200":
          description: Een lijst van genres.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GenreResponseDto"
        "500":
          description: Interne serverfout
  /genres/{genreName}:
    get:
      tags:
      - Genres
      summary: Haal een genre op naam
      description: Vraagt een specifiek genre op basis van de naam.
      parameters:
      - name: genreName
        in: path
        description: Naam van het genre
        required: true
        schema:
          type: string
          example: Rock
      responses:
        "200":
          description: Het gevraagde genre.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreResponseDto"
        "404":
          description: Genre niet gevonden
  /users:
    get:
      tags:
      - Users
      summary: Haal alle gebruikers op
      description: Geeft een lijst terug van alle geregistreerde gebruikers.
      responses:
        "200":
          description: Lijst van gebruikers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponseDto"
        "500":
          description: Interne serverfout
  /users/id/{id}:
    get:
      tags:
      - Users
      summary: Haal gebruiker op via ID
      description: Geeft een specifieke gebruiker terug op basis van het ID.
      parameters:
      - name: id
        in: path
        description: Uniek ID van de gebruiker
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      responses:
        "200":
          description: De gewenste gebruiker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseDto"
        "404":
          description: Gebruiker niet gevonden.
  /users/username/{username}:
    get:
      tags:
      - Users
      summary: Haal gebruiker op via gebruikersnaam
      description: Geeft een specifieke gebruiker terug op basis van de gebruikersnaam.
      parameters:
      - name: username
        in: path
        description: Gebruikersnaam van de gebruiker.
        required: true
        schema:
          type: string
          example: janedoe
      responses:
        "200":
          description: De gewenste gebruiker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseDto"
        "404":
          description: Gebruiker niet gevonden.
  /users/email:
    get:
      tags:
      - Users
      summary: Haal gebruiker op via e-mailadres
      description: Geeft een specifieke gebruiker terug op basis van het e-mailadres.
      parameters:
      - name: email
        in: query
        description: E-mailadres van de gebruiker.
        required: true
        schema:
          type: string
          format: email
          example: janedoe@email.com
      responses:
        "200":
          description: De gewenste gebruiker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseDto"
        "404":
          description: Gebruiker niet gevonden.
  /users/{id}:
    delete:
      tags:
      - Users
      summary: Verwijder een gebruiker
      description: Verwijdert een bestaande gebruiker op basis van het ID.
      operationId: deleteUserById
      parameters:
      - name: id
        in: path
        description: ID van de gebruiker.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      responses:
        "200":
          description: Gebruiker succesvol verwijderd.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_1"
        "404":
          description: Gewenste gebruiker niet gevonden.
        "403":
          description: Niet geauthoriseerd om gebruiker te verwijderen.
      security:
      - BearerAuth: []
  /visitors:
    get:
      tags:
      - Visitors
      summary: Haal alle bezoekers op
      description: Geeft een lijst terug van alle geregistreerde bezoekers.
      responses:
        "200":
          description: Lijst van alle bezoekers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisitorResponseDto"
        "500":
          description: Interne serverfout
  /visitors/{id}:
    get:
      tags:
      - Visitors
      summary: Haal bezoeker op via ID
      description: Geeft een specifieke bezoeker terug op basis van het ID.
      operationId: getVisitorById
      parameters:
      - name: id
        in: path
        description: Uniek ID van de bezoeker.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      responses:
        "200":
          description: De gewenste bezoeker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorResponseDto"
        "404":
          description: Bezoeker niet gevonden.
    delete:
      tags:
      - Visitors
      summary: Verwijder een bezoeker
      description: Verwijdert een bestaande bezoeker op basis van het ID.
      operationId: deleteVisitorById
      parameters:
      - name: id
        in: path
        description: ID van de bezoeker.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      responses:
        "200":
          description: Bezoeker succesvol verwijderd.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_2"
        "404":
          description: Gewenste bezoeker niet gevonden.
        "403":
          description: Niet geauthoriseerd om bezoeker te verwijderen.
      security:
      - BearerAuth: []
    patch:
      tags:
      - Visitors
      summary: Update een bezoeker
      description: Wijzigt een bestaande bezoeker.
      operationId: updateVisitorById
      parameters:
      - name: id
        in: path
        description: ID van de bezoeker.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitorUpdateDto"
        required: true
      responses:
        "200":
          description: Bezoeker succesvol bijgewerkt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorResponseDto"
        "404":
          description: Gewenste bezoeker niet gevonden.
        "403":
          description: Niet geauthoriseerd om bezoeker te bewerken.
        "400":
          description: Ongeldige invoer.
      security:
      - BearerAuth: []
  /visitors/{id}/profile-picture:
    patch:
      tags:
      - Visitors
      summary: Update profielfoto van een bezoeker
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/id_profilepicture_body"
        required: true
      responses:
        "200":
          description: Profielfoto succesvol bijgewerkt.
        "404":
          description: Gewenste bezoeker niet gevonden.
        "403":
          description: Niet geauthoriseerd om profielfoto van bezoeker te verwijderen.
      security:
      - BearerAuth: []
  /visitors/search:
    get:
      tags:
      - Visitors
      summary: Zoek bezoekers op op naam
      description: Geeft een lijst van bezoekers terug die overeenkomen met de opgegeven naam.
      parameters:
      - name: name
        in: query
        description: Naam (of deel van naam) van de bezoeker.
        required: true
        schema:
          type: string
          example: Jansen
      responses:
        "200":
          description: Lijst van gevonden bezoekers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisitorResponseDto"
        "404":
          description: Geen bezoekers gevonden.
  /visitors/register:
    post:
      tags:
      - Visitors
      summary: Registreer een nieuwe bezoeker
      description: Maakt een nieuwe bezoeker aan via multipart/form-data.
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/VisitorInputDto"
        required: true
      responses:
        "201":
          description: Bezoeker succesvol aangemaakt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorResponseDto"
        "400":
          description: Ongeldige invoer.
        "500":
          description: Interne serverfout.
  /visitors/{id}/favorites:
    get:
      tags:
      - Visitors
      summary: Haal favorieten op van een bezoeker
      description: Geeft een lijst van alle favorieten (artworks) van de opgegeven bezoeker.
      operationId: getVisitorFavorites
      parameters:
      - name: id
        in: path
        description: ID van de bezoeker.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      responses:
        "200":
          description: Lijst van favorieten.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtworkResponseDto"
        "404":
          description: Gewenste bezoeker niet gevonden.
  /visitors/{id}/favorites/{artworkId}/add:
    patch:
      tags:
      - Visitors
      summary: Voeg een favoriet toe
      description: Voegt een artwork toe aan de favorietenlijst van een bezoeker.
      operationId: addVisitorFavorite
      parameters:
      - name: id
        in: path
        description: ID van de bezoeker.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      - name: artworkId
        in: path
        description: ID van het artwork dat toegevoegd moet worden.
        required: true
        schema:
          type: integer
          format: int64
          example: 10
      responses:
        "200":
          description: "Favoriet toegevoegd, visitor response bijgewerkt."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorResponseDto"
        "404":
          description: Bezoeker of artwork niet gevonden.
        "403":
          description: Niet geauthoriseerd om favoriet toe te voegen.
      security:
      - BearerAuth: []
  /visitors/{id}/favorites/{artworkId}/remove:
    patch:
      tags:
      - Visitors
      summary: Verwijder een favoriet
      description: Verwijdert een artwork uit de favorietenlijst van een bezoeker.
      operationId: removeVisitorFavorite
      parameters:
      - name: id
        in: path
        description: ID van de bezoeker.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      - name: artworkId
        in: path
        description: ID van het artwork dat verwijderd moet worden.
        required: true
        schema:
          type: integer
          format: int64
          example: 10
      responses:
        "200":
          description: "Favoriet verwijderd, visitor response bijgewerkt."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorResponseDto"
        "404":
          description: Bezoeker of artwork niet gevonden.
        "403":
          description: Niet geauthoriseerd om favoriet te verwijderen.
      security:
      - BearerAuth: []
  /artists:
    get:
      tags:
      - Artists
      summary: Haal alle kunstenaars op
      description: Geeft een lijst van alle geregistreerde kunstenaars terug.
      operationId: getAllArtists
      responses:
        "200":
          description: Lijst van kunstenaars.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtistResponseDto"
        "500":
          description: Interne serverfout.
  /artists/{id}:
    get:
      tags:
      - Artists
      summary: Haal kunstenaar op via ID
      description: Geeft een specifieke kunstenaar terug op basis van het ID.
      operationId: getArtistById
      parameters:
      - name: id
        in: path
        description: Uniek ID van de kunstenaar.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      responses:
        "200":
          description: De gewenste kunstenaar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistResponseDto"
        "404":
          description: Kunstenaar niet gevonden.
    delete:
      tags:
      - Artists
      summary: Verwijder een kunstenaar
      description: Verwijdert een bestaande kunstenaar op basis van ID.
      operationId: deleteArtist
      parameters:
      - name: id
        in: path
        description: ID van de kunstenaar.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      responses:
        "200":
          description: Kunstenaar succesvol verwijderd.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_3"
        "404":
          description: Kunstenaar niet gevonden.
        "403":
          description: Niet geauthoriseerd om kunstenaar te verwijderen.
      security:
      - BearerAuth: []
    patch:
      tags:
      - Artists
      summary: Update informatie van een kunstenaar
      description: Wijzigt de gegevens van een bestaande kunstenaar via JSON.
      operationId: updateArtistInfo
      parameters:
      - name: id
        in: path
        description: ID van de kunstenaar.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtistUpdateDto"
        required: true
      responses:
        "200":
          description: Kunstenaar succesvol bijgewerkt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistResponseDto"
        "404":
          description: Kunstenaar niet gevonden.
        "400":
          description: Ongeldige invoer.
        "403":
          description: Niet geauthoriseerd om kunstenaar te bewerken.
      security:
      - BearerAuth: []
  /artists/search:
    get:
      tags:
      - Artists
      summary: Zoek kunstenaars op naam
      description: Geeft een lijst van kunstenaars terug op basis van voornaam en/of achternaam.
      operationId: getArtistByName
      parameters:
      - name: firstName
        in: query
        description: Voornaam van de kunstenaar.
        required: false
        schema:
          type: string
          example: Henkie
      - name: lastName
        in: query
        description: Achternaam van de kunstenaar.
        required: false
        schema:
          type: string
          example: Jansen
      responses:
        "200":
          description: Lijst van gevonden kunstenaars.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtistResponseDto"
        "404":
          description: Geen kunstenaars gevonden.
  /artists/{id}/artworks:
    get:
      tags:
      - Artists
      summary: Haal alle kunstwerken van een kunstenaar op
      description: Geeft een lijst van kunstwerken die bij een specifieke kunstenaar horen.
      operationId: getArtworksByArtistId
      parameters:
      - name: id
        in: path
        description: ID van de kunstenaar.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      responses:
        "200":
          description: Lijst van kunstwerken van de kunstenaar.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtworkResponseDto"
        "404":
          description: Kunstenaar niet gevonden.
  /artists/register:
    post:
      tags:
      - Artists
      summary: Registreer een nieuwe kunstenaar
      description: Maakt een nieuwe kunstenaar aan via multipart/form-data.
      operationId: createArtist
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ArtistInputDto"
        required: true
      responses:
        "201":
          description: Kunstenaar succesvol aangemaakt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistResponseDto"
        "400":
          description: Ongeldige invoer.
        "500":
          description: Interne serverfout.
  /artists/{id}/profile-picture:
    patch:
      tags:
      - Artists
      summary: Update profielfoto van een kunstenaar
      description: Wijzigt de profielfoto van een kunstenaar via multipart/form-data.
      operationId: updateArtistProfilePicture
      parameters:
      - name: id
        in: path
        description: ID van de kunstenaar.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/id_profilepicture_body_1"
        required: true
      responses:
        "200":
          description: Profielfoto succesvol bijgewerkt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistResponseDto"
        "404":
          description: Kunstenaar niet gevonden.
        "400":
          description: Ongeldige invoer.
        "403":
          description: Niet geauthoriseerd om profielfoto van deze kunstenaar te bewerken.
      security:
      - BearerAuth: []
  /artworks:
    get:
      tags:
      - Artworks
      summary: Haal alle kunstwerken op
      description: Geeft een lijst van alle kunstwerken terug.
      operationId: getAllArtworks
      responses:
        "200":
          description: Lijst van kunstwerken.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtworkResponseDto"
        "500":
          description: Interne serverfout.
    post:
      tags:
      - Artworks
      summary: Maak een nieuw kunstwerk aan
      description: Creëert een nieuw kunstwerk via multipart/form-data.
      operationId: createArtwork
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ArtworkInputDto"
        required: true
      responses:
        "201":
          description: Kunstwerk succesvol aangemaakt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkResponseDto"
        "400":
          description: Ongeldige invoer.
        "403":
          description: Niet bevoegd om een kunstwerk toe te voegen.
        "404":
          description: Kunstenaar niet gevonden.
        "500":
          description: Interne serverfout.
      security:
      - BearerAuth: []
  /artworks/{id}:
    get:
      tags:
      - Artworks
      summary: Haal kunstwerk op via ID
      description: Geeft een specifiek kunstwerk terug op basis van het ID.
      operationId: getArtworkById
      parameters:
      - name: id
        in: path
        description: ID van het kunstwerk.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      responses:
        "200":
          description: Het gevraagde kunstwerk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkResponseDto"
        "404":
          description: Kunstwerk niet gevonden.
    delete:
      tags:
      - Artworks
      summary: Verwijder een kunstwerk
      description: Verwijdert een bestaand kunstwerk op basis van ID.
      operationId: deleteArtwork
      parameters:
      - name: id
        in: path
        description: ID van het kunstwerk.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      responses:
        "200":
          description: Kunstwerk succesvol verwijderd.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_4"
        "404":
          description: Kunstwerk niet gevonden.
        "403":
          description: Niet geauthoriseerd om kunstwerk te verwijderen.
      security:
      - BearerAuth: []
    patch:
      tags:
      - Artworks
      summary: Update een bestaand kunstwerk
      description: Wijzigt gegevens van een bestaand kunstwerk via multipart/form-data.
      operationId: updateArtwork
      parameters:
      - name: id
        in: path
        description: ID van het kunstwerk.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/artworks_id_body"
        required: true
      responses:
        "200":
          description: Kunstwerk succesvol bijgewerkt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkResponseDto"
        "404":
          description: Kunstwerk niet gevonden.
        "400":
          description: Ongeldige invoer.
        "403":
          description: Niet geauthoriseerd om kunstwerk te bewerken.
      security:
      - BearerAuth: []
  /artworks/filter:
    get:
      tags:
      - Artworks
      summary: Filter kunstwerken
      description: "Filtert kunstwerken op basis van titel, kunstenaar, prijs, genres en beschikbaarheid."
      operationId: filterArtworks
      parameters:
      - name: title
        in: query
        description: Titel van het kunstwerk (of deel daarvan).
        required: false
        schema:
          type: string
          example: Zonsondergang
      - name: artistFirstName
        in: query
        description: Voornaam van de kunstenaar.
        required: false
        schema:
          type: string
          example: Henkie
      - name: artistLastName
        in: query
        description: Achternaam van de kunstenaar.
        required: false
        schema:
          type: string
          example: Jansen
      - name: minPrice
        in: query
        description: Minimale prijs filter.
        required: false
        schema:
          type: number
          format: double
          example: 100
      - name: maxPrice
        in: query
        description: Maximale prijs filter.
        required: false
        schema:
          type: number
          format: double
          example: 500
      - name: genres
        in: query
        description: Genres om op te filteren.
        required: false
        schema:
          type: array
          example:
          - Schilderij
          - Landschap
          items:
            type: string
      - name: availabilities
        in: query
        description: Beschikbaarheid van het kunstwerk.
        required: false
        schema:
          type: array
          example:
          - AVAILABLE
          - SOLD
          items:
            type: string
            enum:
            - AVAILABLE
            - AVAILABLETOBUY
            - AVAILABLETOLOAN
            - SOLD
            - ONLOAN
      responses:
        "200":
          description: Lijst van gefilterde kunstwerken.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtworkResponseDto"
        "404":
          description: Geen kunstwerken gevonden.
components:
  schemas:
    RoleResponseDto:
      required:
      - roleName
      type: object
      properties:
        id:
          type: integer
          description: Unieke identifier van de rol.
          format: int64
          example: 1
        roleName:
          type: string
          description: Naam van de rol.
          example: ARTIST
          enum:
          - VISITOR
          - ARTIST
      description: Response DTO voor een rol.
    GenreResponseDto:
      required:
      - name
      type: object
      properties:
        id:
          type: integer
          description: Unieke identifier van het genre.
          format: int64
          example: 1
        name:
          type: string
          description: Naam van het genre.
          example: Impressionisme
        artworkTitles:
          type: array
          description: Kunstwerken met dit genre.
          items:
            type: string
      description: Response DTO voor een genre.
    UserInputDto:
      required:
      - email
      - password
      - username
      type: object
      properties:
        username:
          type: string
          example: janedoe
        email:
          type: string
          format: email
          example: janedoe@email.com
        password:
          maxLength: 64
          minLength: 8
          pattern: "^(?=.*[0-9])(?=.*[a-zA-Z])(?=.*[@#$%^&+=!]).*$"
          type: string
          description: "Wachtwoord moet tussen 8 en 64 tekens zijn en minstens één letter, één cijfer en één speciaal teken bevatten."
          format: password
          example: Wachtwoord123!
        profilePicture:
          type: string
          description: Bestandsnaam of URL van de profielfoto.
          example: profile.jpg
        profilePictureFile:
          type: string
          description: Upload van een profielfoto.
          format: binary
      description: Basis input DTO voor een gebruiker.
    UserResponseDto:
      required:
      - email
      - id
      - username
      type: object
      properties:
        id:
          type: integer
          description: Unieke identifier van de gebruiker.
          format: int64
          example: 1
        username:
          type: string
          description: Gebruikersnaam van de gebruiker.
          example: janedoe
        email:
          type: string
          description: E-mailadres van de gebruiker.
          format: email
          example: janedoe@email.com
        dateOfRegistration:
          type: string
          description: Datum dat de gebruiker zich heeft geregistreerd (dd-mm-yyyy).
          format: date
        profilePicture:
          type: string
          description: URL of bestandsnaam van profielfoto van de gebruiker.
          example: profile.jpg
        roleNames:
          type: array
          description: Lijst van rollen van de gebruiker
          example:
          - VISITOR
          items:
            type: string
            enum:
            - VISITOR
            - ARTIST
      description: Bais response DTO voor een gebruiker.
    VisitorInputDto:
      allOf:
      - $ref: "#/components/schemas/UserInputDto"
      - required:
        - name
        type: object
        properties:
          name:
            type: string
            description: Naam van de bezoeker
            example: Jane Doe
        description: Input DTO voor het registreren of bijwerken van een bezoeker.
    VisitorUpdateDto:
      type: object
      properties:
        name:
          type: string
          description: Nieuwe naam.
        username:
          type: string
          description: Nieuwe username.
        email:
          type: string
          description: Nieuw e-mailadres.
          format: email
        password:
          maxLength: 64
          minLength: 8
          pattern: "^(?=.*[0-9])(?=.*[a-zA-Z])(?=.*[@#$%^&+=!]).*$"
          type: string
          description: Nieuw wachtwoord.
    VisitorResponseDto:
      required:
      - name
      properties:
        name:
          type: string
          description: Naam van de bezoeker.
          example: Jane Doe
        favoritesIds:
          type: array
          description: Lijst van IDs van de favoriete kunstwerken van de bezoeker.
          items:
            type: integer
            format: int64
      description: Response DTO van een bezoeker.
      allOf:
      - $ref: "#/components/schemas/UserResponseDto"
      - type: object
    ArtistInputDto:
      allOf:
      - $ref: "#/components/schemas/UserInputDto"
      - required:
        - biography
        - city
        - firstName
        - lastName
        - typeOfArt
        type: object
        properties:
          firstName:
            type: string
            description: Voornaam van de kunstenaar.
            example: Henkie
          lastName:
            type: string
            description: Achternaam van de kunstenaar.
            example: Jansen
          city:
            type: string
            description: Stad waar de kunstenaar actief is.
            example: Amsterdam
          typeOfArt:
            type: string
            description: Soort kunst die de artiest maakt.
            example: Schilderijen
          biography:
            maxLength: 250
            minLength: 20
            type: string
            description: Korte biografie van de kunstenaar.
            example: "Hallo, Henkie hier. Ik ben een beginnend abstract schilder met een grote liefde voor kleur, beweging en..."
        description: Input DTO voor een kunstenaar.
    ArtistUpdateDto:
      type: object
      properties:
        username:
          type: string
          example: modernekunstenaar
        email:
          type: string
          format: email
          example: artist@example.com
        password:
          maxLength: 64
          minLength: 8
          pattern: "^(?=.*[0-9])(?=.*[a-zA-Z])(?=.*[@#$%^&+=!]).*$"
          type: string
          example: Nieuw123!
        firstName:
          type: string
          example: Henk
        lastName:
          type: string
          example: Jansen
        city:
          type: string
          example: Utrecht
        typeOfArt:
          type: string
          example: Schilderijen
        biography:
          maxLength: 250
          minLength: 20
          type: string
          example: "Ik ben een moderne kunstenaar die experimenteert met kleur, vorm en expressie."
      description: Update DTO voor het gedeeltelijk updaten van een artist.
    ArtistResponseDto:
      allOf:
      - $ref: "#/components/schemas/UserResponseDto"
      - type: object
        properties:
          firstName:
            type: string
            example: Henkie
          lastName:
            type: string
            example: Jansen
          city:
            type: string
            example: Amsterdam
          typeOfArt:
            type: string
            example: Schilderijen
          biography:
            type: string
            example: "Hallo, Henkie hier. Ik ben een beginnend abstract schilder met een grote liefde voor kleur, beweging en..."
          portfolioTitles:
            type: array
            description: Lijst van titels van kunstwerken in het portfolio van de kunstenaar.
            example:
            - Zonsondergang
            - Zonsopgang
            items:
              type: string
        description: Response DTO van een kunstenaar.
    ArtworkInputDto:
      required:
      - availability
      - genreNames
      - images
      - price
      - title
      type: object
      properties:
        title:
          type: string
          description: Titel van het kunstwerk.
          example: Zonsondergang
        images:
          type: array
          description: Upload van afbeeldingen.
          items:
            type: string
            format: binary
        genreNames:
          type: array
          description: Lijst van genres gekoppeld aan het kunstwerk.
          example:
          - Schilderij
          - Landschap
          items:
            type: string
        price:
          type: number
          description: Prijs van het kunstwerk.
          format: double
          example: 250
        availability:
          type: string
          description: Beschikbaarheid van het kunstwerk.
          example: AVAILABLE
        widthInCm:
          type: integer
          description: Breedte van het kunstwerk in cm.
          example: 60
        lengthInCm:
          type: integer
          description: Lengte van het kunstwerk in cm.
          example: 80
        heightInCm:
          type: integer
          description: Hoogte van het kunstwerk in cm.
          example: 2
      description: Input DTO voor het aanmaken van een nieuw kunstwerk.
    ArtworkUpdateDto:
      type: object
      properties:
        title:
          type: string
          description: Nieuwe titel van het kunstwerk.
          example: Zonsopgang
        removeImages:
          type: array
          description: Lijst van afbeeldingsbestanden die verwijderd moeten worden.
          items:
            type: string
        genreNames:
          type: array
          description: Bijgewerkte genres van het kunstwerk.
          items:
            type: string
        price:
          type: number
          description: Bijgewerkte prijs.
          format: double
          example: 300
        availability:
          type: string
          description: Bijgewerkte beschikbaarheid.
          example: SOLD
        widthInCm:
          type: integer
          description: Bijgewerkte breedte in cm.
          example: 60
        lengthInCm:
          type: integer
          description: Bijgewerkte lengte in cm.
          example: 80
        heightInCm:
          type: integer
          description: Bijgewerkte hoogte in cm.
          example: 2
      description: Input DTO voor het bijwerken van een kunstwerk.
    ArtworkResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Zonsondergang
        images:
          type: array
          description: Lijst van afbeeldingsbestanden (namen of URLs).
          example:
          - image1.jpg
          - image2.jpg
          items:
            type: string
        genreNames:
          type: array
          example:
          - Schilderij
          - Landschap
          items:
            type: string
        price:
          type: number
          format: double
          example: 250
        availability:
          type: string
          example: AVAILABLE
        availabilityLabel:
          type: string
