          example: profile.jpg
        roleNames:
          type: array
          description: Lijst van rollen van de gebruiker
          items:
            type: string
            enum:
              - VISITOR
              - ARTIST
          example:
            - VISITOR
      required:
        - id
        - username
        - email
    
    VisitorInputDto:
      allOf:
