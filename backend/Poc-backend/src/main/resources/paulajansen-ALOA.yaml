openapi: 3.0.0
servers:
  # Added by API Auto Mocking Plugin
  # Added by API Auto Mocking Plugin
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/freelance-9e2/A-Lot-Of-Art/1.0.0
  - description: SwaggerHub API Auto Mocking
    url: https://localhost:8080
info:
  version: "1.0.0"
  title: A Lot Of Art API Documentation
  description: | 
    De A Lot Of Artwork (ALOA) web-API is een gemakkelijke etalage voor kunstenaars om hun werken de wereld in te sturen en een winkel voor bezoekers die geïnteresseerd zijn in toegankelijke kunst. Zij kunnen hier zoeken naar werk dat het aanspreekt en dit uiteindelijk ook kopen en/of huren.

    ## Beveiliging

    Sommige endpoints zijn beveiligd. Een gebruiker moet ingelogd zijn en/of een bepaalde rol hebben om gebruik te maken van deze endpoints. De huidige rollen zijn:

    - VISITOR: bedoeld voor gebruikers die als bezoeker het platform willen gebruiken om te zoeken naar kunst.
    - ARTIST: bedoeld voor gebruikers die als kunstenaar hun kunstwerken op het platform willen plaatsen.

    Een gebruiker die een beveiligde endpoint succesvol wil gebruiken moet geautheticeerd worden door in de header van een request een JSON Web Token (JWT) als Bearer token mee te sturen.
  
paths:
  /auth:
    post:
      summary: Inloggen
      description: Logt een gebruiker in en geeft een JWT token terug. Bij dit request moet een username en password meegestuurd worden. 
      tags:
        - Authentication 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: 
                - username
                - password
              properties:
                username: 
                  type: string
                  example: janedoe
                password:
                  type: string
                  example: janedoespassword
      responses:
        '200':
          description: Een json object met daarin een jwt.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Ongeldige gebruikersnaam of wachtwoord.

  /roles:
    get:
      summary: Haal rollen op
      description: Haalt alle beschikbare rollen op.
      tags: 
        - Roles
      responses:
        '200':
          description: Een lijst van alle bestaande rollen.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponseDto'
        '500':
            description: Interne serverfout.

  /roles/{roleName}:
    get: 
      summary: Haal een rol op
      description: Haalt een rol op naam op.
      tags:
        - Roles
      parameters:
      - name: roleName
        in: path
        required: true
        description: Naam van de rol
        schema:
          type: string
          enum:
            - VISITOR
            - ARTIST
      responses:
        '200':
          description: Een specifieke rol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponseDto'
        '404':
          description: Rol niet gevonden.
  
  /genres:
    get:
      summary: Haal alle genres op
      description: Vraagt een lijst van alle beschikbare genres op.
      tags:
        - Genres
      responses:
        '200':
          description: Een lijst van genres.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenreResponseDto'
        '500':
          description: Interne serverfout

  /genres/{genreName}:
    get:
      summary: Haal een genre op naam
      description: Vraagt een specifiek genre op basis van de naam.
      tags:
        - Genres
      parameters:
        - name: genreName
          in: path
          required: true
          description: Naam van het genre
          schema:
            type: string
            example: Rock
      responses:
        '200':
          description: Het gevraagde genre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreResponseDto'
        '404':
          description: Genre niet gevonden
  
  /users/search:
    get:
      summary: Haal gebruikers op
      description: Geeft een lijst terug van ofwel een gebruiker met een bepaalde gebruikersnaam of e-mailadres of alle geregistreerde gebruikers.
      tags:
        - Users
      responses:
        '200':
          description: Lijst van gebruikers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponseDto'
        '500':
          description: Interne serverfout

  /users/{id}:
    get:
      summary: Haal gebruiker op via ID
      description: Geeft een specifieke gebruiker terug op basis van het ID.
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          description: Uniek ID van de gebruiker
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: De gewenste gebruiker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '404':
          description: Gebruiker niet gevonden.

    delete:
      operationId: deleteUserById
      summary: Verwijder een gebruiker
      description: Verwijdert een bestaande gebruiker op basis van het ID.
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID van de gebruiker.
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Gebruiker succesvol verwijderd.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Gebruiker met ID 1 is verwijderd
        '404':
          description: Gewenste gebruiker niet gevonden.
        '403':
          description: Niet geauthoriseerd om gebruiker te verwijderen.

  /visitors:
    get:
      summary: Haal alle bezoekers op
      description: Geeft een lijst terug van alle geregistreerde bezoekers.
      tags:
        - Visitors
      responses:
        '200':
          description: Lijst van alle bezoekers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitorResponseDto'
        '500':
          description: Interne serverfout

  /visitors/{id}:
    get:
      operationId: getVisitorById
      summary: Haal bezoeker op via ID
      description: Geeft een specifieke bezoeker terug op basis van het ID.
      tags:
        - Visitors
      parameters:
        - name: id
          in: path
          required: true
          description: Uniek ID van de bezoeker.
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: De gewenste bezoeker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorResponseDto'
        '404':
          description: Bezoeker niet gevonden.

    patch:
      operationId: updateVisitorById
      summary: Update een bezoeker
      description: Wijzigt een bestaande bezoeker.
      tags:
        - Visitors
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID van de bezoeker.
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorUpdateDto'
      responses:
        '200':
          description: Bezoeker succesvol bijgewerkt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorResponseDto'
        '404':
          description: Gewenste bezoeker niet gevonden.
        '403':
          description: Niet geauthoriseerd om bezoeker te bewerken.
        '400':
          description: Ongeldige invoer.

    delete:
      operationId: deleteVisitorById
      summary: Verwijder een bezoeker
      description: Verwijdert een bestaande bezoeker op basis van het ID.
      tags:
        - Visitors
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID van de bezoeker.
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Bezoeker succesvol verwijderd.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bezoeker met ID 1 is verwijderd
        '404':
          description: Gewenste bezoeker niet gevonden.
        '403':
          description: Niet geauthoriseerd om bezoeker te verwijderen.

  /visitors/{id}/profile-picture:
    patch:
      summary: Update profielfoto van een bezoeker
      tags:
        - Visitors
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                profilePicture:
                  type: string
                  format: binary
      responses:
        '200':
          description: Profielfoto succesvol bijgewerkt.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitorResponseDto'
        '404':
          description: Gewenste bezoeker niet gevonden.
        '403':
          description: Niet geauthoriseerd om profielfoto van bezoeker te verwijderen.

  /visitors/search:
    get:
      summary: Zoek bezoekers op op naam
      description: Geeft een lijst van bezoekers terug die overeenkomen met de opgegeven naam.
      tags:
        - Visitors
      parameters:
        - name: name
          in: query
          required: true
          description: Naam (of deel van naam) van de bezoeker.
          schema:
            type: string
            example: Jansen
      responses:
        '200':
          description: Lijst van gevonden bezoekers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitorResponseDto'
        '404':
          description: Geen bezoekers gevonden.

  /visitors/register:
    post:
      summary: Registreer een nieuwe bezoeker
      description: Maakt een nieuwe bezoeker aan via multipart/form-data.
      tags:
        - Visitors
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitorInputDto'
      responses:
        '201':
          description: Bezoeker succesvol aangemaakt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorResponseDto'
        '400':
          description: Ongeldige invoer.
        '500':
          description: Interne serverfout.
  
  /visitors/{id}/favorites:
    get:
      operationId: getVisitorFavorites
      summary: Haal favorieten op van een bezoeker
      description: Geeft een lijst van alle favorieten (artworks) van de opgegeven bezoeker.
      tags:
        - Visitors
      parameters:
        - name: id
          in: path
          required: true
          description: ID van de bezoeker.
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Lijst van favorieten.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtworkResponseDto'
        '404':
          description: Gewenste bezoeker niet gevonden.

  /visitors/{id}/favorites/{artworkId}/add:
    patch:
      operationId: addVisitorFavorite
      summary: Voeg een favoriet toe
      description: Voegt een artwork toe aan de favorietenlijst van een bezoeker.
      tags:
        - Visitors
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID van de bezoeker.
          schema:
            type: integer
            format: int64
            example: 1
        - name: artworkId
          in: path
          required: true
          description: ID van het artwork dat toegevoegd moet worden.
          schema:
            type: integer
            format: int64
            example: 10
      responses:
        '200':
          description: Favoriet toegevoegd, visitor response bijgewerkt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorResponseDto'
        '404':
          description: Bezoeker of artwork niet gevonden.
        '403':
          description: Niet geauthoriseerd om favoriet toe te voegen.

  /visitors/{id}/favorites/{artworkId}/remove:
    patch:
      operationId: removeVisitorFavorite
      summary: Verwijder een favoriet
      description: Verwijdert een artwork uit de favorietenlijst van een bezoeker.
      tags:
        - Visitors
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID van de bezoeker.
          schema:
            type: integer
            format: int64
            example: 1
        - name: artworkId
          in: path
          required: true
          description: ID van het artwork dat verwijderd moet worden.
          schema:
            type: integer
            format: int64
            example: 10
      responses:
        '200':
          description: Favoriet verwijderd, visitor response bijgewerkt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorResponseDto'
        '404':
          description: Bezoeker of artwork niet gevonden.
        '403':
          description: Niet geauthoriseerd om favoriet te verwijderen.

  /artists:
    get:
      operationId: getAllArtists
      summary: Haal alle kunstenaars op
      description: Geeft een lijst van alle geregistreerde kunstenaars terug.
      tags:
        - Artists
      responses:
        '200':
          description: Lijst van kunstenaars.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtistResponseDto'
        '500':
          description: Interne serverfout.

  /artists/{id}:
    get:
      operationId: getArtistById
      summary: Haal kunstenaar op via ID
      description: Geeft een specifieke kunstenaar terug op basis van het ID.
      tags:
        - Artists
      parameters:
        - name: id
          in: path
          required: true
          description: Uniek ID van de kunstenaar.
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: De gewenste kunstenaar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistResponseDto'
        '404':
          description: Kunstenaar niet gevonden.

    patch:
      operationId: updateArtistInfo
      summary: Update informatie van een kunstenaar
      description: Wijzigt de gegevens van een bestaande kunstenaar via JSON.
      tags:
        - Artists
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID van de kunstenaar.
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistUpdateDto'
      responses:
        '200':
          description: Kunstenaar succesvol bijgewerkt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistResponseDto'
        '404':
          description: Kunstenaar niet gevonden.
        '400':
          description: Ongeldige invoer.
        '403':
          description: Niet geauthoriseerd om kunstenaar te bewerken.

    delete:
      operationId: deleteArtist
      summary: Verwijder een kunstenaar
      description: Verwijdert een bestaande kunstenaar op basis van ID.
      tags:
        - Artists
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID van de kunstenaar.
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Kunstenaar succesvol verwijderd.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Kunstenaar met ID 1 is verwijderd.
        '404':
          description: Kunstenaar niet gevonden.
        '403':
          description: Niet geauthoriseerd om kunstenaar te verwijderen.

  /artists/search:
    get:
      operationId: getArtistByName
      summary: Zoek kunstenaars op naam
      description: Geeft een lijst van kunstenaars terug op basis van voornaam en/of achternaam.
      tags:
        - Artists
      parameters:
        - name: firstName
          in: query
          required: false
          description: Voornaam van de kunstenaar.
          schema:
            type: string
            example: Henkie
        - name: lastName
          in: query
          required: false
          description: Achternaam van de kunstenaar.
          schema:
            type: string
            example: Jansen
      responses:
        '200':
          description: Lijst van gevonden kunstenaars.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtistResponseDto'
        '404':
          description: Geen kunstenaars gevonden.

  /artists/{id}/artworks:
    get:
      operationId: getArtworksByArtistId
      summary: Haal alle kunstwerken van een kunstenaar op
      description: Geeft een lijst van kunstwerken die bij een specifieke kunstenaar horen.
      tags:
        - Artists
      parameters:
        - name: id
          in: path
          required: true
          description: ID van de kunstenaar.
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Lijst van kunstwerken van de kunstenaar.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtworkResponseDto'
        '404':
          description: Kunstenaar niet gevonden.
  
  /artists/register:
    post:
      operationId: createArtist
      summary: Registreer een nieuwe kunstenaar
      description: Maakt een nieuwe kunstenaar aan via multipart/form-data.
      tags:
        - Artists
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtistInputDto'
      responses:
        '201':
          description: Kunstenaar succesvol aangemaakt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistResponseDto'
        '400':
          description: Ongeldige invoer.
        '500':
          description: Interne serverfout.    

  /artists/{id}/profile-picture:
    patch:
      operationId: updateArtistProfilePicture
      summary: Update profielfoto van een kunstenaar
      description: Wijzigt de profielfoto van een kunstenaar via multipart/form-data.
      tags:
        - Artists
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID van de kunstenaar.
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                profilePicture:
                  type: string
                  format: binary
                  description: Nieuwe profielfoto.
      responses:
        '200':
          description: Profielfoto succesvol bijgewerkt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistResponseDto'
        '404':
          description: Kunstenaar niet gevonden.
        '400':
          description: Ongeldige invoer.
        '403':
          description: Niet geauthoriseerd om profielfoto van deze kunstenaar te bewerken.
    
  /artworks:
    get:
      operationId: getAllArtworks
      summary: Haal alle kunstwerken op
      description: Geeft een lijst van alle kunstwerken terug.
      tags:
        - Artworks
      responses:
        '200':
          description: Lijst van kunstwerken.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtworkResponseDto'
        '500':
          description: Interne serverfout.

    post:
      operationId: createArtwork
      summary: Maak een nieuw kunstwerk aan
      description: Creëert een nieuw kunstwerk via multipart/form-data.
      tags:
        - Artworks
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtworkInputDto'
      responses:
        '201':
          description: Kunstwerk succesvol aangemaakt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkResponseDto'
        '400':
          description: Ongeldige invoer.
        '403':
            description: Niet bevoegd om een kunstwerk toe te voegen.
        '404':
          description: Kunstenaar niet gevonden.
        '500':
          description: Interne serverfout.

  /artworks/{id}:
    get:
      operationId: getArtworkById
      summary: Haal kunstwerk op via ID
      description: Geeft een specifiek kunstwerk terug op basis van het ID.
      tags:
        - Artworks
      parameters:
        - name: id
          in: path
          required: true
          description: ID van het kunstwerk.
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Het gevraagde kunstwerk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkResponseDto'
        '404':
          description: Kunstwerk niet gevonden.

    patch:
      operationId: updateArtwork
      summary: Update een bestaand kunstwerk
      description: Wijzigt gegevens van een bestaand kunstwerk via multipart/form-data.
      tags:
        - Artworks
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID van het kunstwerk.
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                artwork:
                  type: string
                  description: JSON-string van ArtworkUpdateDto.
                  example: '{"title":"Nieuwe titel","price":3000.0}'
                images:
                  type: array
                  description: Optionele extra afbeeldingen.
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Kunstwerk succesvol bijgewerkt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkResponseDto'
        '404':
          description: Kunstwerk niet gevonden.
        '400':
          description: Ongeldige invoer.
        '403':
          description: Niet geauthoriseerd om kunstwerk te bewerken.

    delete:
      operationId: deleteArtwork
      summary: Verwijder een kunstwerk
      description: Verwijdert een bestaand kunstwerk op basis van ID.
      tags:
        - Artworks
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID van het kunstwerk.
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Kunstwerk succesvol verwijderd.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Kunstwerk met ID 1 is verwijderd.
        '404':
          description: Kunstwerk niet gevonden.
        '403':
          description: Niet geauthoriseerd om kunstwerk te verwijderen.

  /artworks/filter:
    get:
      operationId: filterArtworks
      summary: Filter kunstwerken
      description: Filtert kunstwerken op basis van titel, kunstenaar, prijs, genres en beschikbaarheid.
      tags:
        - Artworks
      parameters:
        - name: title
          in: query
          required: false
          description: Titel van het kunstwerk (of deel daarvan).
          schema:
            type: string
            example: Zonsondergang
        - name: artistFirstName
          in: query
          required: false
          description: Voornaam van de kunstenaar.
          schema:
            type: string
            example: Henkie
        - name: artistLastName
          in: query
          required: false
          description: Achternaam van de kunstenaar.
          schema:
            type: string
            example: Jansen
        - name: minPrice
          in: query
          required: false
          description: Minimale prijs filter.
          schema:
            type: number
            format: double
            example: 100.00
        - name: maxPrice
          in: query
          required: false
          description: Maximale prijs filter.
          schema:
            type: number
            format: double
            example: 500.00
        - name: genres
          in: query
          required: false
          description: Genres om op te filteren.
          schema:
            type: array
            items:
              type: string
            example:
              - Schilderij
              - Landschap
        - name: availabilities
          in: query
          required: false
          description: Beschikbaarheid van het kunstwerk.
          schema:
            type: array
            items:
              type: string
              enum:
                - AVAILABLE
                - AVAILABLETOBUY
                - AVAILABLETOLOAN
                - SOLD
                - ONLOAN
            example:
              - AVAILABLE
              - SOLD
      responses:
        '200':
          description: Lijst van gefilterde kunstwerken.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtworkResponseDto'
        '404':
          description: Geen kunstwerken gevonden.

components:
  schemas:
    RoleResponseDto:
      type: object
      description: Response DTO voor een rol.
      properties:
        id:
          type: integer
          format: int64
          description: Unieke identifier van de rol.
          example: 1
        roleName:
          type: string
          description: Naam van de rol.
          enum:
            - VISITOR
            - ARTIST
          example: ARTIST
      required:
        - roleName
        
    GenreResponseDto:
      type: object
      description: Response DTO voor een genre.
      properties:
        id:
          type: integer
          format: int64
          description: Unieke identifier van het genre.
          example: 1
        name:
          type: string
          description: Naam van het genre.
          example: Impressionisme
        artworkTitles:
          type: array
          description: Kunstwerken met dit genre.
          items:
            type: string
      required:
        - name
    
    UserInputDto:
      type: object
      description: Basis input DTO voor een gebruiker.
      properties:
        username:
          type: string
          example: janedoe
        email:
          type: string
          format: email
          example: janedoe@email.com
        password:
          type: string
          format: password
          description: Wachtwoord moet tussen 8 en 64 tekens zijn en minstens één letter, één cijfer en één speciaal teken bevatten.
          minLength: 8
          maxLength: 64
          pattern: "^(?=.*[0-9])(?=.*[a-zA-Z])(?=.*[@#$%^&+=!]).*$"
          example: Wachtwoord123!
        profilePicture:
          type: string
          description: Bestandsnaam of URL van de profielfoto.
          example: profile.jpg
        profilePictureFile:
          type: string
          format: binary
          description: Upload van een profielfoto.
      required:
        - username
        - email
        - password
        
    UserResponseDto:
      type: object
      description: Bais response DTO voor een gebruiker.
      properties:
        id:
          type: integer
          format: int64
          description: Unieke identifier van de gebruiker.
          example: 1
        username:
          type: string
